<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyssna | MikalLearn</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/study-aura.css?v=1">
  <script src="/static/app.js?v=keep-after-30-v1" defer></script>
  <script src="/static/listening.js" defer></script>
  <style>
    .listening-panel{margin-top:28px}.listening-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.listening-progress{padding:7px 10px;color:var(--primary);background:var(--primary-soft);font-size:9px;font-weight:900}.listen-buttons-v2{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.listen-buttons-v2 button{margin:0;color:#373a47;background:#fff;border:1px solid var(--border)}.listen-writing-label{display:block;margin-top:28px;color:#777d8c;font-size:10px;font-weight:850;letter-spacing:.7px}#listenAnswer{min-height:150px}.listen-action-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px}.listen-action-row button{margin:0}.listen-right-actions{display:flex;gap:8px}.listen-secondary{color:#454956;background:#fff;border:1px solid var(--border)}.listen-next{color:#fff;background:#191b25}.listen-action-row button:disabled{opacity:.35;cursor:not-allowed;transform:none}.listen-result{margin-top:18px}.listen-result:empty{display:none}.listen-correct,.listen-wrong,.listen-warning{padding:18px}.listen-correct{color:#17653a;background:#eaf8ef;border:1px solid #c9ecd6}.listen-wrong{color:#743d34;background:#fff2ef;border:1px solid #f1cdc6}.listen-warning{color:#735613;background:#fff8e7;border:1px solid #f1dfad}.listen-result-title{font-size:14px;font-weight:900}.listen-result p{margin:7px 0 0;font-size:12px;line-height:1.6}.correct-sentence{display:flex;flex-direction:column;gap:5px;margin-top:14px;padding:14px 15px;color:#252833;background:rgba(255,255,255,.72)}.correct-sentence span{color:#848996;font-size:9px;font-weight:800;letter-spacing:.7px}.correct-sentence strong{font-size:13px;line-height:1.55}@media(max-width:720px){.listen-action-row{align-items:stretch;flex-direction:column}.listen-right-actions{display:grid;grid-template-columns:1fr 1fr}.listen-action-row button{width:100%}}
  </style>
  <script src="/static/listening-words.js?v=500-5x" defer></script>
  <script src="/static/cloud-sync.js?v=local3"></script>
</head>
<body class="study-page">
<div class="container">
  <a href="/" class="back">&larr; Tillbaka</a>
  <p class="small">SVENSKA &bull; LYSSNA</p>
  <h1>Lyssna &amp; skriv &#127911;</h1>
  <p class="subtitle">Lyssna p&aring; meningen och skriv exakt det du h&ouml;r.</p>
  <div class="practice-panel listening-panel">
    <div class="listening-top"><div class="audio-circle">&#127911;</div><span class="listening-progress" id="listenProgress">1 mening</span></div>
    <p class="practice-label" id="listenNumber">MENING 1</p>
    <h2>Lyssna noggrant</h2>
    <p class="help-text">Spela upp meningen och skriv sedan exakt det du h&ouml;r. Du kan lyssna flera g&aring;nger.</p>
    <div class="listen-buttons-v2"><button type="button" id="playNormal">&#9654; Spela upp</button><button type="button" id="playSlow">&#128034; L&aring;ngsammare</button></div>
    <label class="listen-writing-label">SKRIV VAD DU H&Ouml;R</label>
    <textarea id="listenAnswer" placeholder="Skriv meningen h&auml;r..." spellcheck="false"></textarea>
    <div class="listen-action-row">
      <button type="button" class="check-button" id="checkListening">Kontrollera</button>
      <div class="listen-right-actions"><button type="button" class="listen-secondary" id="retrySentence" disabled>&#8635; G&ouml;r om</button><button type="button" class="listen-next" id="nextSentence" disabled>N&auml;sta mening &rarr;</button></div>
    </div>
    <div id="listenResult" class="listen-result"></div>
  </div>
</div>
</body>
</html>
