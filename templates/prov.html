<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lördagsprov | MikalLearn</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/prov.css?v=3">
  <script src="/static/cloud-sync.js?v=local3"></script>
  <script src="/static/prov.js?v=3" defer></script>
</head>
<body class="prov-page">
  <main class="prov-shell">
    <a href="/" class="prov-back">← Tillbaka</a>
    <header class="prov-header">
      <div><p class="prov-kicker">LÖRDAGSPROV • SVENSKA</p><h1>Skriv en egen text</h1><p>Skriv med egna ord. Minst 200 ord.</p></div>
      <div class="prov-badge">📝 PROV</div>
    </header>
    <section class="topic-card">
      <div class="topic-copy"><span>DITT ÄMNE</span><h2 id="topicText">Laddar ämne...</h2></div>
      <button type="button" id="newTopicBtn" class="topic-button">↻ Nytt ämne</button>
    </section>
    <section class="document-wrap">
      <div class="document-paper">
        <div class="document-topline"><span>MIKALLEARN</span><span>MINST 200 ORD</span></div>
        <div class="document-title" id="documentTopic">Ämne</div>
        <textarea id="essayInput" class="essay-input" spellcheck="false" lang="sv" placeholder="Börja skriva här..."></textarea>
        <div id="doneMessage" class="done-message" aria-live="polite"></div>
        <div class="document-footer">
          <div class="word-progress-wrap">
            <div class="word-count-row"><strong id="wordCount">0 ord</strong><span>Minst 200 ord</span></div>
            <div class="word-track"><div class="word-fill" id="wordFill"></div></div>
          </div>
          <div class="document-actions"><button type="button" id="finishBtn" class="finish-btn" disabled>Skriv 200 ord till</button></div>
        </div>
      </div>
    </section>
    <p class="prov-help">När du har skrivit minst 200 ord kan du trycka <b>Klar</b>. Sedan kan du själv läsa igenom texten.</p>
  </main>
</body>
</html>
